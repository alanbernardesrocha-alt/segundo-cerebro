# fly.toml app configuration file generated for segundo-cerebro-k2rdca on 2026-07-26T18:35:14Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'segundo-cerebro-k2rdca'
primary_region = 'gru'

[build]

[env]
  DATABASE_URL = 'file:/data/dev.db'
  NODE_ENV = 'production'
  UPLOAD_DIR = '/data/uploads'

[[mounts]]
  source = 'segundo_cerebro_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
