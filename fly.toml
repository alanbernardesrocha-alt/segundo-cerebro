app = "segundo-cerebro"
primary_region = "gru"

[build]

[env]
  DATABASE_URL = "file:/data/dev.db"
  UPLOAD_DIR = "/data/uploads"
  NODE_ENV = "production"

[[mounts]]
  source = "segundo_cerebro_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
